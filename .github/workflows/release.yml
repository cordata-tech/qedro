name: Release

# Fires on a `v*` tag. The tag is the decision; everything here is mechanical.
#
# Before the first release this needs a **trusted publisher** configured on
# PyPI for `cordata-tech/qedro`, workflow `release.yml`, environment `pypi`.
# Trusted publishing rather than an API token on purpose: there is no long-lived
# credential to leak, and a project whose README argues about provenance should
# not be uploading artefacts from a secret in a settings page.
on:
  push:
    tags: ["v*"]
  # A dry run. Everything except the upload — tests, build, twine — so the
  # workflow can be proved to work before a tag is pushed, and a tag is the one
  # thing that cannot be taken back.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag says what version this is. The package says the same thing from
  # `qedro.__version__`, and a release where those two disagree is one nobody
  # can reason about afterwards — so it fails here rather than shipping.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      # The same step `ci.yml` carries, and for the same reason: two test
      # modules import `pipeline_runtime` so the generated facet schema can be
      # checked against the model it comes from. Without it `pytest` stops at
      # collection — which is what the first dry run of this workflow found,
      # and would otherwise have been discovered on the tag push.
      - name: Install the descriptor model the facet schema is generated from
        run: >
          pip install --no-deps
          "cordata-pipeline-runtime @ git+https://github.com/cordata-tech/pipeline-runtime@main"

      - name: The tag matches the version in the package
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, sys
          from qedro import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"tag {tag} does not match qedro {__version__}")
          print(f"{tag} matches qedro {__version__}")
          PY

      - name: The changelog has an entry for it
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, pathlib, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text().splitlines()
          heading = next((line for line in changelog if line.startswith(f"## {version}")), None)
          if heading is None:
              sys.exit(f"CHANGELOG.md has no entry for {version}")
          # A release whose changelog still says "unreleased" is one nobody
          # updated. Cheaper to fail here than to notice on PyPI, where the
          # version number cannot be reused.
          if "unreleased" in heading.lower():
              sys.exit(f"CHANGELOG.md still marks {version} as unreleased — date it")
          print(f"CHANGELOG.md documents {version}: {heading}")
          PY

      - name: Test
        run: pytest -q

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag publishes. A manual run stops after the build, which is what
    # makes the dry run safe to use.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
