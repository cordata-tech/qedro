name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the published code needs; 3.13 catches the
        # deprecations that turn into breakage a release later.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The Art. 30 facet schema is generated from
      # `pipeline_runtime.descriptor.Processing`, and `tests/test_facet_schema.py`
      # fails when they diverge — so the model has to be importable here.
      #
      # `--no-deps` because `descriptor.py` needs pydantic and nothing else, and
      # `@main` rather than a tag on purpose: the point of the test is to notice
      # when the upstream model moves, and pinning would defer that to whenever
      # someone bumped the pin.
      - name: Install the descriptor model the facet schema is generated from
        run: >
          pip install --no-deps
          "cordata-pipeline-runtime @ git+https://github.com/cordata-tech/pipeline-runtime@main"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: The wordmark is a valid SVG and carries a text alternative
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('docs/wordmark.svg').getroot()
          ns = {'s': 'http://www.w3.org/2000/svg'}
          assert r.get('role') == 'img', 'wordmark needs role=img'
          assert r.get('aria-label') == 'Qedro', 'wordmark needs aria-label'
          assert r.find('s:title', ns) is not None, 'wordmark needs a <title>'
          print('wordmark ok')
          "
