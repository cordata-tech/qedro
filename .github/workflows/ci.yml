name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the published code needs; 3.13 catches the
        # deprecations that turn into breakage a release later.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: The wordmark is a valid SVG and carries a text alternative
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          r = ET.parse('docs/wordmark.svg').getroot()
          ns = {'s': 'http://www.w3.org/2000/svg'}
          assert r.get('role') == 'img', 'wordmark needs role=img'
          assert r.get('aria-label') == 'Qedro', 'wordmark needs aria-label'
          assert r.find('s:title', ns) is not None, 'wordmark needs a <title>'
          print('wordmark ok')
          "
