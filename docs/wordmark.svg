<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 72" width="209" height="72"
     role="img" aria-label="Qedro">
  <title>Qedro</title>
  <desc>The word QEDR followed by a solid square — the Halmos tombstone, standing in for the final letter O.</desc>
  <style>
    /* Light is the default; dark is redefined under the media query so the
       mark stays legible on GitHub's dark README background. Both are set
       explicitly — an unset fill inherits the host page and can vanish. */
    .ink { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e2e8f0; }
    }
    .word {
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 56px;
      font-weight: 600;
    }
  </style>

  <!-- textLength pins the word to an exact width regardless of which font in
       the stack actually resolves. Without it the rect below has to be placed
       against a guess at the metrics, and the guess is wrong the moment Inter
       is unavailable — which on GitHub it always is. lengthAdjust="spacing"
       distributes the difference into letter-spacing rather than stretching
       the glyphs, so the letterforms stay honest. -->
  <text x="4" y="54" class="word ink"
        textLength="160" lengthAdjust="spacing">QEDR</text>

  <!-- The tombstone, sitting on the baseline where the O would be. A rect
       rather than the U+220E glyph on purpose: font coverage for END OF PROOF
       is thin, and a missing glyph renders the wordmark as "QEDR□". -->
  <rect x="169" y="18" width="36" height="36" class="ink"/>
</svg>
