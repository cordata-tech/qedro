<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72"
     role="img" aria-label="Qedro">
  <title>Qedro</title>
  <desc>The word QEDR followed by a solid square — the Halmos tombstone, standing in for the final letter O.</desc>
  <style>
    /* Light is the default; dark is redefined under the media query so the
       mark stays legible on GitHub's dark README background. Both are set
       explicitly — an unset fill inherits the host page and can vanish. */
    .ink { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e2e8f0; }
    }
    .word {
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: 2px;
    }
  </style>

  <text x="4" y="55" class="word ink">QEDR</text>

  <!-- The tombstone. A rect rather than the U+220E glyph on purpose: font
       coverage for END OF PROOF is thin, and a missing glyph would render
       the wordmark as "QEDR□". A rect renders everywhere. -->
  <rect x="152" y="20" width="34" height="34" class="ink"/>
</svg>
