[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qedro"
description = "Turns emitted evidence into the artefacts an auditor asks for"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Cordata", email = "contact@cordata.tech" }]
keywords = ["openlineage", "governance", "gdpr", "dsgvo", "ropa", "data-lineage"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
# Two runtime dependencies, and each is here for a reason worth writing down.
#
# pyyaml is for `qedro.yaml`. Config and vocabulary documents are user-written,
# so `document.py` reads YAML, JSON and TOML — TOML is stdlib and JSON comes
# free with the YAML parser, which leaves exactly this. safe_load only: nothing
# in a user's config should be able to construct a Python object.
#
# openpyxl is for `--format xlsx`. Not an optional extra, because the headline
# command in cordata-tech/qedro#2 is `--out ropa.xlsx` and the acceptance test
# is `pipx install qedro` — putting the artefact an auditor actually asks for
# behind an extra somebody has to know to type makes the main deliverable
# conditional on trivia. It is pure Python with one dependency of its own, so
# this is nothing like the duckdb/pandas/pyarrow trade refused below. The
# import is lazy, in `render.xlsx`, so a run that produces text never pays it.
dependencies = ["pyyaml>=6", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # `tools/facet_schema.py` generates the Art. 30 facet schema from
    # `pipeline_runtime.descriptor.Processing`, and a test fails when the two
    # diverge. The runtime itself is installed `--no-deps` in CI: descriptor.py
    # imports pydantic and nothing else, and pulling duckdb, pandas, pyarrow and
    # great-expectations in to read a type declaration is not a trade worth
    # making. This is the one dependency of that import.
    "pydantic>=2.9",
]

[project.scripts]
qedro = "qedro.__main__:main"

[project.urls]
Homepage = "https://cordata.tech"
Source = "https://github.com/cordata-tech/qedro"
Changelog = "https://github.com/cordata-tech/qedro/blob/main/CHANGELOG.md"
Issues = "https://github.com/cordata-tech/qedro/issues"

# One source for the version, and it is the one `qedro --version` prints.
# Restating it here would be the same mistake the facet schema exists to avoid,
# with nothing to catch the drift.
[tool.setuptools.dynamic]
version = { attr = "qedro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The shipped starter ontology. It is data the tool loads at runtime, so it has
# to be installed beside the code rather than only existing in the repository.
[tool.setuptools.package-data]
qedro = ["vocabularies/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
