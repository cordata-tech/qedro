[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qedro"
version = "0.0.1"
description = "Turns emitted evidence into the artefacts an auditor asks for"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Cordata", email = "hello@cordata.tech" }]
keywords = ["openlineage", "governance", "gdpr", "dsgvo", "ropa", "data-lineage"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
qedro = "qedro.__main__:main"

[project.urls]
Homepage = "https://cordata.tech"
Source = "https://github.com/cordata-tech/qedro"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
