[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qedro"
version = "0.0.1"
description = "Turns emitted evidence into the artefacts an auditor asks for"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Cordata", email = "hello@cordata.tech" }]
keywords = ["openlineage", "governance", "gdpr", "dsgvo", "ropa", "data-lineage"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
# The one runtime dependency, and it is here for `qedro.yaml`. Config and
# vocabulary documents are user-written, so `document.py` reads YAML, JSON and
# TOML — TOML is stdlib and JSON comes free with the YAML parser, which leaves
# exactly this. safe_load only: nothing in a user's config should be able to
# construct a Python object.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # `tools/facet_schema.py` generates the Art. 30 facet schema from
    # `pipeline_runtime.descriptor.Processing`, and a test fails when the two
    # diverge. The runtime itself is installed `--no-deps` in CI: descriptor.py
    # imports pydantic and nothing else, and pulling duckdb, pandas, pyarrow and
    # great-expectations in to read a type declaration is not a trade worth
    # making. This is the one dependency of that import.
    "pydantic>=2.9",
]

[project.scripts]
qedro = "qedro.__main__:main"

[project.urls]
Homepage = "https://cordata.tech"
Source = "https://github.com/cordata-tech/qedro"

[tool.setuptools.packages.find]
where = ["src"]

# The shipped starter ontology. It is data the tool loads at runtime, so it has
# to be installed beside the code rather than only existing in the repository.
[tool.setuptools.package-data]
qedro = ["vocabularies/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
