# What each field of a record answers in the GDPR, and the regulation's own
# words for it (#48).
#
# This file is DATA, like a vocabulary: qedro loads it at runtime and has no
# compiled knowledge of any article in it. Mapping a record to another
# regulation — or to a national one beside the GDPR — is a matter of writing
# another document like this one and pointing `references:` in qedro.yaml at it.
#
# The wording is quoted, never paraphrased: a paraphrase is a reading of the law,
# and that is a person's job, not this tool's. Every quote below was compared,
# character for character, with the English text EUR-Lex serves for CELEX
# 32016R0679 on 2026-11-18. Keep its punctuation as it is: the official text
# writes "controller's" with a straight apostrophe and ‘accountability’ with
# curved quotes, and a tidier quote would no longer be a quote.

name: gdpr
regulation: Regulation (EU) 2016/679 (General Data Protection Regulation)
source: https://eur-lex.europa.eu/eli/reg/2016/679/oj

references:
  art-5-2:
    cite: Art. 5(2) GDPR
    text: >-
      The controller shall be responsible for, and be able to demonstrate
      compliance with, paragraph 1 (‘accountability’).
  art-6-1:
    cite: Art. 6(1) GDPR
    text: >-
      Processing shall be lawful only if and to the extent that at least one of
      the following applies:
  art-30-1-a:
    cite: Art. 30(1)(a) GDPR
    text: >-
      the name and contact details of the controller and, where applicable, the
      joint controller, the controller's representative and the data protection
      officer;
  art-30-1-b:
    cite: Art. 30(1)(b) GDPR
    text: the purposes of the processing;
  art-30-1-c:
    cite: Art. 30(1)(c) GDPR
    text: >-
      a description of the categories of data subjects and of the categories of
      personal data;
  art-30-1-d:
    cite: Art. 30(1)(d) GDPR
    text: >-
      the categories of recipients to whom the personal data have been or will
      be disclosed including recipients in third countries or international
      organisations;
  art-30-1-e:
    cite: Art. 30(1)(e) GDPR
    text: >-
      where applicable, transfers of personal data to a third country or an
      international organisation, including the identification of that third
      country or international organisation and, in the case of transfers
      referred to in the second subparagraph of Article 49(1), the documentation
      of suitable safeguards;
  art-30-1-f:
    cite: Art. 30(1)(f) GDPR
    text: >-
      where possible, the envisaged time limits for erasure of the different
      categories of data;
  art-30-1-g:
    cite: Art. 30(1)(g) GDPR
    text: >-
      where possible, a general description of the technical and organisational
      security measures referred to in Article 32(1).

# Which reference each field of the record answers. A field with none is left
# out rather than given a near miss: the legal basis is not one of the seven
# items Art. 30(1) lists, so it answers Art. 6(1), which requires one.
fields:
  record: art-5-2
  controller: art-30-1-a
  purpose: art-30-1-b
  legal_basis: art-6-1
  data_category: art-30-1-c
  special_category: art-30-1-c
  subject_type: art-30-1-c
  recipients: art-30-1-d
  residency: art-30-1-e
  retention: art-30-1-f
  security_measures: art-30-1-g
